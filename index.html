<!DOCTYPE html>
<!--
  index.html — the one page of the Telematics app.
  It holds the top bar, an empty <main> that JavaScript fills in
  (js/app.js draws each screen), and the bottom tab bar.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Fit phone screens; viewport-fit=cover lets us use the whole iPhone
       screen (styles.css adds "safe-area" padding around the notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="See every sensor your phone's browser can read, live, with charts and recording." />

  <!-- PWA ("installable web app") settings — see README -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Telematics" />

  <title>Telematics — live phone sensors</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/barlow-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/roboto-mono-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="#/sensors" class="brand">
      <img class="brand-icon" src="icons/icon-192.png" alt="" width="28" height="28" />
      <span>Telematics</span>
    </a>
    <span class="grow"></span>
    <!-- Shows "REC 00:12" while recording (filled in by app.js) -->
    <a href="#/record" class="status-tag rec-tag" id="rec-tag" hidden>REC</a>
    <span class="status-tag" id="live-tag">Idle</span>
  </header>

  <!-- JavaScript draws each screen in here -->
  <main id="app" class="container" tabindex="-1"></main>

  <!-- Bottom tab bar -->
  <nav class="tabbar" aria-label="Sections">
    <a href="#/sensors" data-tab="sensors"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h3l3-7 4 14 3-7h5"/></svg>Sensors</a>
    <a href="#/record" data-tab="record"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>Record</a>
    <a href="#/sessions" data-tab="sessions"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Sessions</a>
    <a href="#/device" data-tab="device"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="1.5"/><path d="M10.5 18.5h3"/></svg>Device</a>
  </nav>

  <!-- Scripts load in order: helpers first, the app last -->
  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sensors.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
