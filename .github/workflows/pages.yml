# Publishes the repository root to GitHub Pages on every push to main.
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site (GitHub Actions source) the first time this runs.
          enablement: true
      - name: Make the Pages site public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pages" --input - <<'EOF'
          {"public": true}
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Repo root is the site. Include .nojekyll (hidden files are off by default).
          path: .
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
